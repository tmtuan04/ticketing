# Load balancer trước các replica gateway, chỉ dùng trong profile load test.
#
# Vì sao cần: gateway là một tiến trình Node, một CPU cho event loop. Đo với 5.000 VU thì gateway bão
# hòa ở ~1.000 RPS (504 vì event loop trễ, tràn backlog TCP) trong khi inventory mới dùng ~20% CPU.
# Gateway không giữ trạng thái (rate limit nằm ở Redis, refresh token ở Postgres) nên scale ngang
# được ngay; nginx chia request round-robin giữa các replica.

# 2 worker là đủ cho vài nghìn RPS; `auto` = số CPU của máy (12) => 12 x worker_connections tốn RAM vô ích
worker_processes 2;

events {
    # mỗi kết nối client tốn 1 slot, cộng thêm kết nối tới upstream
    worker_connections 8192;
}

http {
    access_log off;

    upstream gateway {
        # Docker DNS trả về IP của MỌI replica tên `gateway`; nginx phân giải lúc khởi động
        # (replica đổi IP thì restart LB, đủ cho load test).
        # max_fails=0: một lần lỗi kết nối không đủ để loại replica (mặc định 1 lỗi => loại 10s; khi
        # cả 3 replica cùng dính một lần reset dưới tải thì nginx trả 502 "no live upstreams" hàng loạt)
        server gateway:3000 max_fails=0;
        # giữ sẵn kết nối tới gateway, không mở TCP mới cho mỗi request
        keepalive 512;
        # đóng kết nối rảnh TRƯỚC gateway (keepAliveTimeout 65s, Node mặc định 5s) để không bao giờ
        # gửi request lên socket mà gateway đang đóng
        keepalive_timeout 4s;
    }

    server {
        # backlog lớn: 5.000 VU mở kết nối cùng lúc, mặc định 511 sẽ tràn => k6 báo "dial: i/o timeout"
        listen 80 backlog=8192;
        keepalive_requests 100000;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $http_x_request_id;
        }
    }
}
