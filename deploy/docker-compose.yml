name: ticketing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5440:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      retries: 15

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  # Chạy migration một lần rồi thoát; inventory chỉ khởi động khi migration thành công.
  inventory-migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../services/inventory/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://app:app@postgres:5432/inventory_db?sslmode=disable", "up"]
    depends_on:
      postgres: { condition: service_healthy }

  inventory:
    build:
      context: ..
      dockerfile: services/inventory/Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://app:app@postgres:5432/inventory_db?sslmode=disable
      REDIS_ADDR: redis:6379
      HOLD_TTL: 5m
    ports: ["50051:50051"]
    healthcheck:
      test: ["CMD", "/inventory", "healthcheck"]
      interval: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      inventory-migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redpanda:
