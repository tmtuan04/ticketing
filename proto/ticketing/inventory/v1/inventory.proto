syntax = "proto3";

package ticketing.inventory.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// InventoryService quản lý trạng thái ghế của từng event: giữ, nhả, xác nhận bán.
service InventoryService {
  // Catalog gọi khi publish event. Idempotent: gọi lại không tạo trùng ghế.
  rpc InitEventInventory(InitEventInventoryRequest) returns (InitEventInventoryResponse);
  // Giữ một nhóm ghế trong TTL. Trùng idempotency_key thì trả lại hold cũ.
  rpc HoldSeats(HoldSeatsRequest) returns (HoldSeatsResponse);
  // User hủy giữ chỗ, hoặc Order hủy khi thanh toán lỗi (Phase 2).
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse);
  // held -> sold. Chỉ thành công khi hold còn hạn.
  rpc ConfirmHold(ConfirmHoldRequest) returns (ConfirmHoldResponse);
  // Order gọi khi tạo đơn, để hold sống lâu hơn hạn thanh toán (Phase 2).
  rpc ExtendHold(ExtendHoldRequest) returns (ExtendHoldResponse);
  rpc GetHold(GetHoldRequest) returns (GetHoldResponse);
  // Trạng thái từng ghế, để vẽ sơ đồ ghế.
  rpc ListSeatAvailability(ListSeatAvailabilityRequest) returns (ListSeatAvailabilityResponse);
}

enum SeatStatus {
  SEAT_STATUS_UNSPECIFIED = 0;
  SEAT_STATUS_AVAILABLE = 1;
  SEAT_STATUS_HELD = 2;
  SEAT_STATUS_SOLD = 3;
}

enum HoldStatus {
  HOLD_STATUS_UNSPECIFIED = 0;
  HOLD_STATUS_ACTIVE = 1;
  HOLD_STATUS_RELEASED = 2;
  HOLD_STATUS_CONFIRMED = 3;
  HOLD_STATUS_EXPIRED = 4;
}

message Hold {
  string id = 1;
  string event_id = 2;
  string user_id = 3;
  repeated string seat_ids = 4;
  HoldStatus status = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SeatAvailability {
  string seat_id = 1;
  SeatStatus status = 2;
}

message SeatsUnavailable {
  // Những ghế trong request đã bị người khác giữ hoặc đã bán.
  repeated string seat_ids = 1;
}

message InitEventInventoryRequest {
  string event_id = 1;
  repeated string seat_ids = 2;
}

message InitEventInventoryResponse {
  int32 seat_count = 1;
}

message HoldSeatsRequest {
  string event_id = 1;
  string user_id = 2;
  repeated string seat_ids = 3;
  string idempotency_key = 4;
}

message HoldSeatsResponse {
  // Ghế bị chiếm là kết quả nghiệp vụ bình thường, không phải gRPC error.
  oneof result {
    Hold hold = 1;
    SeatsUnavailable unavailable = 2;
  }
}

message ReleaseHoldRequest {
  string hold_id = 1;
  // Hold phải thuộc về user này, ngược lại trả PERMISSION_DENIED.
  string user_id = 2;
}

message ReleaseHoldResponse {
  Hold hold = 1;
}

message ConfirmHoldRequest {
  string hold_id = 1;
}

message ConfirmHoldResponse {
  Hold hold = 1;
}

message ExtendHoldRequest {
  string hold_id = 1;
  // Hold phải thuộc về user này, ngược lại trả PERMISSION_DENIED.
  string user_id = 2;
  // Hạn mới = now + ttl. Chỉ kéo dài, không rút ngắn: nếu hạn hiện tại đã xa hơn thì giữ nguyên.
  // Inventory chặn ttl quá lớn (INVALID_ARGUMENT). Hold không còn active/đã hết hạn: FAILED_PRECONDITION.
  google.protobuf.Duration ttl = 3;
}

message ExtendHoldResponse {
  Hold hold = 1;
}

message GetHoldRequest {
  string hold_id = 1;
}

message GetHoldResponse {
  Hold hold = 1;
}

message ListSeatAvailabilityRequest {
  string event_id = 1;
}

message ListSeatAvailabilityResponse {
  repeated SeatAvailability seats = 1;
}
