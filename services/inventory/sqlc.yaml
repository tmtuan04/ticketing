version: "2"
sql:
  - engine: postgresql
    # sqlc đọc thẳng migration của golang-migrate, tự bỏ qua file *.down.sql
    schema: migrations
    queries: queries
    gen:
      go:
        package: repo
        out: internal/repo
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # Mặc định pgx/v5 sinh pgtype.UUID / pgtype.Timestamptz; đổi sang kiểu chuẩn cho dễ dùng
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
